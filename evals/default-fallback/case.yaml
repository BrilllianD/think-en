schema_version: "1.1"
name: default-fallback
tags: [smoke]
description: "English question, no language argument — the default in references/default.md decides."
expected_outcome: "Answer in Russian, with one short clause saying so; no meta about the resolution order."
runs: 2
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep]
  prompt: |
    Read SKILL.md from your working directory and follow it for this reply. The profiles it
    refers to are in `references/`. Treat the line below as the arguments of a `/think-en`
    invocation.

    why does `npm ci` fail when `package-lock.json` is out of date?
context:
  scaffold_script: setup.sh
